<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You're invited · Love Will Tear Us Apart</title>
  <meta name="description" content="Someone wants to be your person on Love Will Tear Us Apart.">
  <meta property="og:title" content="Be my person 💗">
  <meta property="og:description" content="Tap to connect on Love Will Tear Us Apart.">
  <meta property="og:image" content="https://lovewilltearusapart.com/img/icon.png">
  <link rel="icon" href="/favicon.png">
  <link rel="apple-touch-icon" href="/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
  <style>
    /* An invite link (https://lwtua.app/i/<code>). With the app installed, iOS
       opens the app instead of this page; this is what everyone else sees. */
    :root { --ink: #2a2340; --pink: #ff6fa3; --pink-edge: #c94478; --cream: #fff8ee; --cream-edge: #e3d6c2; --font: 'Pixelify Sans', system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: linear-gradient(#78cff5, #bfe9fb 55%, #ffe3ef); color: var(--ink); font: 500 1.15rem/1.45 var(--font); }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem 1.25rem; }
    main { display: grid; justify-items: center; gap: 1.1rem; max-width: 26rem; text-align: center; }
    img { width: 132px; height: 132px; border: 3px solid var(--ink); border-radius: 28%; box-shadow: 0 5px 0 var(--ink); }
    h1 {
      margin: 0.4rem 0 0; color: #fff; font-size: 2.6rem; line-height: 1.05; letter-spacing: 0.04em;
      text-shadow: -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink), 2px 2px 0 var(--ink), 0 -2px 0 var(--ink), 0 2px 0 var(--ink), -2px 0 0 var(--ink), 2px 0 0 var(--ink), 0 6px 0 var(--ink);
    }
    p { margin: 0; }
    .button {
      display: block; width: 100%; padding: 0.7rem 1.2rem 1.05rem; border: 3px solid var(--ink); border-radius: 16px;
      font: 700 1.4rem/1 var(--font); letter-spacing: 0.04em; text-decoration: none; transition: transform 80ms ease-out, box-shadow 80ms ease-out;
    }
    .open { background: var(--pink); color: #fff; box-shadow: inset 0 -7px 0 var(--pink-edge), 0 5px 0 var(--ink);
      text-shadow: -1.5px -1.5px 0 var(--ink), 1.5px -1.5px 0 var(--ink), -1.5px 1.5px 0 var(--ink), 1.5px 1.5px 0 var(--ink), 0 3px 0 var(--ink); }
    .get { background: var(--cream); color: var(--ink); box-shadow: inset 0 -6px 0 var(--cream-edge), 0 5px 0 var(--ink); }
    .button:active { transform: translateY(4px); }
    .hint { font-size: 0.95rem; }
    :focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
    @media (prefers-reduced-motion: reduce) { .button { transition: none; } }
  </style>
</head>
<body>
  <main>
    <img src="/icon.png" alt="">
    <h1 id="title">You're invited</h1>
    <p id="lede">Someone wants to be your person on Love Will Tear Us Apart.</p>
    <a class="button open" id="open" href="https://lovewilltearusapart.com/">Open the invite</a>
    <a class="button get" id="get" href="https://apps.apple.com/app/id6826732006">Get the app</a>
    <p class="hint" id="hint">New here? Tap Get the app. Once it's installed, open it and tap Paste on the first screen: your invite comes with you.</p>
  </main>
  <script>
    // /i/<code>: point "Open the invite" at the app with that code. Anything else
    // here isn't an invite, so just offer the app.
    const code = (location.pathname.match(/^\/i\/([A-Za-z0-9_-]{12,64})\/?$/) || [])[1];
    if (code) {
      document.getElementById('open').href = 'lwtua://connect?token=' + code;
      // iOS can't carry a link through an App Store install, so take the invite
      // along on the clipboard: the app's first screen offers to paste it.
      const get = document.getElementById('get');
      get.addEventListener('click', (e) => {
        if (!navigator.clipboard) return;
        e.preventDefault();
        const go = () => { location.href = get.href; };
        navigator.clipboard.writeText('https://lwtua.app/i/' + code).then(go, go);
      });
    } else {
      document.getElementById('title').textContent = 'Love Will Tear Us Apart';
      document.getElementById('lede').textContent = "That link isn't an invite. Here's the app it's for.";
      document.getElementById('open').remove();
      document.getElementById('hint').remove();
    }
  </script>
</body>
</html>
